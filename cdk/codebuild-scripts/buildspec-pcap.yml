version: 0.2
phases:
  pre_build:
    commands:
      - echo "=== Phase Pre-build - ECR Login ==="
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "=== Phase Build - Create Dockerfile, Build, Push ==="
      - mkdir -p /tmp/build && cd /tmp/build

      # Create Dockerfile inline.
      # Builds the open-source Wireshark MCP (bx33661/Wireshark-MCP) pinned to a
      # known-good PyPI release, then runs our S3-aware streamable-http wrapper.
      - |
        cat > Dockerfile << 'EOF'
        FROM public.ecr.aws/docker/library/python:3.13-slim

        RUN apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            tshark tcpdump curl git && \
            rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        # Install Wireshark MCP (pinned PyPI release) as a library + boto3 for S3.
        # Pinned to a published wheel for reproducible, build-free installs.
        ARG WIRESHARK_MCP_VERSION=1.1.5
        RUN pip install --no-cache-dir \
              "wireshark-mcp==${WIRESHARK_MCP_VERSION}" \
              boto3

        COPY server.py /app/server.py

        RUN mkdir -p /tmp/pcap_storage

        ENV PCAP_STORAGE_DIR=/tmp/pcap_storage
        ENV WIRESHARK_MCP_ALLOWED_DIRS=/tmp/pcap_storage
        ENV PYTHONUNBUFFERED=1

        EXPOSE 8000

        HEALTHCHECK --interval=30s --timeout=5s --retries=3 \
          CMD curl -sf http://localhost:8000/mcp || exit 1

        CMD ["python", "/app/server.py"]
        EOF

      # Copy the server wrapper from S3 source
      - cp $CODEBUILD_SRC_DIR/server-wrapper.py server.py

      - echo "=== Build ARM64 image ==="
      - docker build -t $ECR_REPO_URI:latest .

      - echo "=== Push to ECR ==="
      - docker push $ECR_REPO_URI:latest

      - echo "=== Create or Update AgentCore Runtime ==="
      - |
        DISCOVERY_URL="https://cognito-idp.$AWS_DEFAULT_REGION.amazonaws.com/$COGNITO_USER_POOL_ID/.well-known/openid-configuration"
        ARTIFACT="{\"containerConfiguration\":{\"containerUri\":\"$ECR_REPO_URI:latest\"}}"
        AUTHZ="{\"customJWTAuthorizer\":{\"discoveryUrl\":\"$DISCOVERY_URL\",\"allowedClients\":[\"$COGNITO_CLIENT_ID\"]}}"

        # If a runtime already exists (from a previous deploy), UPDATE it in place
        # so the runtime ARN / MCP endpoint stays the same and no re-registration
        # in Agent Space is needed. Otherwise CREATE a fresh runtime.
        EXISTING_ID=$(aws ssm get-parameter --name "/pcap-mcp/runtime-id" --query Parameter.Value --output text --region $AWS_DEFAULT_REGION 2>/dev/null || echo "")

        if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "FAILED" ] && [ "$EXISTING_ID" != "None" ]; then
          echo "Updating existing runtime in place: $EXISTING_ID"
          UPDATE_RESULT=$(aws bedrock-agentcore-control update-agent-runtime \
            --agent-runtime-id "$EXISTING_ID" \
            --role-arn $ROLE_ARN \
            --network-configuration '{"networkMode":"PUBLIC"}' \
            --protocol-configuration '{"serverProtocol":"MCP"}' \
            --authorizer-configuration "$AUTHZ" \
            --agent-runtime-artifact "$ARTIFACT" \
            --region $AWS_DEFAULT_REGION 2>&1)
          echo "Update result: $UPDATE_RESULT"
          RUNTIME_ID="$EXISTING_ID"
          RUNTIME_ARN=$(aws ssm get-parameter --name "/pcap-mcp/runtime-arn" --query Parameter.Value --output text --region $AWS_DEFAULT_REGION 2>/dev/null || echo "FAILED")
        else
          RUNTIME_NAME="wiresharkMcp$(date +%s)"
          echo "Creating runtime: $RUNTIME_NAME"
          CREATE_RESULT=$(aws bedrock-agentcore-control create-agent-runtime \
            --agent-runtime-name "$RUNTIME_NAME" \
            --description "Wireshark MCP Server (packet capture analysis)" \
            --role-arn $ROLE_ARN \
            --network-configuration '{"networkMode":"PUBLIC"}' \
            --protocol-configuration '{"serverProtocol":"MCP"}' \
            --authorizer-configuration "$AUTHZ" \
            --agent-runtime-artifact "$ARTIFACT" \
            --region $AWS_DEFAULT_REGION 2>&1)
          echo "Create result: $CREATE_RESULT"
          RUNTIME_ID=$(echo "$CREATE_RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('agentRuntimeId','FAILED'))" 2>/dev/null || echo "FAILED")
          RUNTIME_ARN=$(echo "$CREATE_RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('agentRuntimeArn','FAILED'))" 2>/dev/null || echo "FAILED")
        fi

        echo "Runtime ID: $RUNTIME_ID"
        echo "Runtime ARN: $RUNTIME_ARN"

        ENCODED_ARN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$RUNTIME_ARN', safe=''))")
        MCP_ENDPOINT="https://bedrock-agentcore.$AWS_DEFAULT_REGION.amazonaws.com/runtimes/$ENCODED_ARN/invocations?qualifier=DEFAULT"
        echo "MCP Endpoint URL: $MCP_ENDPOINT"

        aws ssm put-parameter --name "/pcap-mcp/runtime-id" --value "$RUNTIME_ID" --type String --overwrite --region $AWS_DEFAULT_REGION
        aws ssm put-parameter --name "/pcap-mcp/runtime-arn" --value "$RUNTIME_ARN" --type String --overwrite --region $AWS_DEFAULT_REGION
        aws ssm put-parameter --name "/pcap-mcp/mcp-endpoint-url" --value "$MCP_ENDPOINT" --type String --overwrite --region $AWS_DEFAULT_REGION

      - echo "=== DONE ==="

  post_build:
    commands:
      - echo "PCAP MCP Server deployed successfully."
